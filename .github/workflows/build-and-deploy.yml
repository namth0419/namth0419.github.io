name: Build CV and deploy site

# cv.json 을 고쳐서 push 하면:
#   build.py → index.html + cv.tex 생성 → LaTeX 컴파일 → cv.pdf → Pages 배포
on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능

# 기본 권한은 읽기만. 배포 권한(pages, id-token)은 아래 deploy 단계에만 줌
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Generate index.html and cv.tex from cv.json
        run: python3 build.py

      - name: Compile cv.tex with LaTeX
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098  # v3 (외부 도구라 커밋으로 고정)
        with:
          root_file: cv.tex
          # latexmk가 pdflatex를 필요한 횟수만큼 자동 반복 실행합니다.

      - name: Verify build output
        run: ls -lh index.html cv.tex cv.pdf

      - name: Upload site (with freshly generated index.html and cv.pdf)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
