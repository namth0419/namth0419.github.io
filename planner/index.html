<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 개인용 페이지: 검색엔진에 노출하지 않음. 홈페이지 어디에도 링크하지 마세요. -->
<meta name="robots" content="noindex, nofollow">
<!-- 보안: 이 페이지가 불러올 수 있는 출처를 제한. 스크립트는 이 사이트와 Firebase(Google)만.
     외부 서비스를 새로 쓰게 되면 여기에 주소를 추가해야 합니다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://air-quality-api.open-meteo.com https://archive-api.open-meteo.com https://api.crossref.org https://api.datacite.org https://date.nager.at; frame-src https://namth0419.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Research Planner</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<!-- 앱으로 설치 (manifest.webmanifest, sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">

<!-- 테마를 그리기 전에 결정 (홈페이지와 같은 localStorage 키 공유) -->
<script src="theme-init.js?v=50"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  /* 바탕은 튀지 않는 옅은 중립색. 포인트 색(--deep, --film-*)은 season.js 가 계절에 맞춰 덮어씀 */
  :root{
    color-scheme:light;
    --ink:#1f1d1a;
    --wafer:#f7f6f3;
    --card:#fcfbf9;
    --rule:#e3e0da;
    --muted:#77726b;
    --deep:#b4532a;
    --film-1:#b4532a;
    --film-2:#d9822f;
    --film-3:#c9a24a;
    --film-4:#5f7f55;
    --danger:#B4342D;
    --film: linear-gradient(90deg,var(--film-1) 0%,var(--film-2) 34%,var(--film-3) 67%,var(--film-4) 100%);
    --display:"Archivo","Noto Sans KR",system-ui,sans-serif;
    --ui:"Noto Sans KR",system-ui,sans-serif;
    --body:"Source Serif 4","Noto Sans KR",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ink:#e8e6e2;
    --wafer:#141517;
    --card:#1b1c1f;
    --rule:#2c2e32;
    --muted:#95918b;
    --deep:#f0915e;
    --film-1:#e0703f;
    --film-2:#f2a052;
    --film-3:#e5c06e;
    --film-4:#8fb27d;
    --danger:#E5716A;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--wafer);color:var(--ink);
    font-family:var(--ui);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--deep);text-decoration:none}
  :focus-visible{outline:2px solid var(--deep);outline-offset:2px}
  button{font:inherit;color:inherit}

  .film-top{position:fixed;top:0;left:0;right:0;height:3px;background:var(--film);z-index:20}

  /* ---- top bar ---- */
  .top{
    max-width:1140px;margin:0 auto;padding:20px 28px 0;
    display:flex;align-items:center;gap:14px;
    font-family:var(--mono);font-size:11.5px;color:var(--muted);
  }
  .top .home{color:var(--muted)}
  .top .home:hover{color:var(--deep)}
  .top .who{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
  .top .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .theme-toggle{
    width:32px;height:32px;display:grid;place-items:center;flex:none;
    border:1px solid var(--rule);background:transparent;color:var(--muted);
    border-radius:2px;cursor:pointer;padding:0;
  }
  .theme-toggle:hover{color:var(--ink);border-color:var(--muted)}
  .theme-toggle svg{width:15px;height:15px;display:none}
  .theme-toggle .moon{display:block}
  :root[data-theme="dark"] .theme-toggle .moon{display:none}
  :root[data-theme="dark"] .theme-toggle .sun{display:block}

  /* ---- layout ---- */
  .wrap{
    max-width:1140px;margin:0 auto;padding:30px 28px 96px;
    display:grid;grid-template-columns:300px 1fr;gap:48px;align-items:start;
  }
  .ms{position:sticky;top:24px}
  main{min-width:0;border-left:1px solid var(--rule);padding-left:40px}
  section{margin:0 0 38px}
  h2{
    font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin:0 0 10px;
    display:flex;align-items:center;gap:12px;
  }
  h2::after{content:"";flex:1;height:1px;background:var(--rule)}

  /* ---- month navigation + stats ---- */
  .month-nav{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
  .month-nav .m{
    font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;
    margin:0 6px;min-width:6.4em;text-align:center;
  }
  .nav-btn{
    width:32px;height:32px;border:1px solid var(--rule);background:transparent;
    border-radius:2px;cursor:pointer;font-size:15px;color:var(--muted);
  }
  .nav-btn:hover{color:var(--ink);border-color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 34px}
  .stat{background:var(--card);border:1px solid var(--rule);padding:12px 14px}
  .stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em}
  .stat .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
  .bar{height:3px;background:var(--rule);margin-top:8px;position:relative;overflow:hidden}
  .bar > i{position:absolute;top:0;bottom:0;left:0;background:var(--film-4);transition:width .25s}

  /* ---- items ---- */
  .items{list-style:none;margin:0;padding:0}
  .item{border-bottom:1px dotted var(--rule)}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;min-height:40px}
  .row input[type=checkbox]{
    appearance:none;-webkit-appearance:none;margin:0;flex:none;cursor:pointer;
    width:17px;height:17px;border:1.5px solid var(--muted);border-radius:2px;
    display:grid;place-content:center;background:transparent;
  }
  .row input[type=checkbox]:checked{background:var(--film-4);border-color:var(--film-4)}
  .row input[type=checkbox]:checked::after{
    content:"";width:8px;height:4px;border:2px solid var(--wafer);border-top:0;border-right:0;
    transform:translateY(-1px) rotate(-45deg);
  }
  .title{
    all:unset;flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere;font-size:15px;
  }
  .title:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
  .done > .row .title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
  .chip{
    font-family:var(--mono);font-size:10.5px;color:var(--muted);
    border:1px solid var(--rule);border-radius:2px;padding:1px 6px;
    max-width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;
  }
  .when{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none}
  .cnt{
    all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:4px;
    color:var(--muted);font-family:var(--mono);font-size:11px;opacity:.45;padding:2px;
  }
  .cnt svg{width:14px;height:14px}
  .row:hover .cnt,.cnt.has,.open > .row .cnt{opacity:1}
  .cnt:focus-visible{outline:2px solid var(--deep)}
  .ms-bar{margin:-4px 0 8px 27px}

  .detail{padding:2px 0 16px 27px;display:grid;gap:12px}
  .fields{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .fields label{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  input.edit,select,input[type=date],textarea,input.add{
    font:inherit;font-size:14px;color:var(--ink);background:var(--card);
    border:1px solid var(--rule);border-radius:2px;padding:6px 9px;min-width:0;
  }
  input.edit{flex:1 1 220px}
  select{max-width:100%}
  input.edit:focus,select:focus,input[type=date]:focus,textarea:focus{outline:none;border-color:var(--deep)}

  .comments{list-style:none;margin:0;padding:0;border-left:2px solid var(--rule)}
  .comments li{padding:3px 0 7px 12px}
  .comments .meta{display:flex;gap:10px;align-items:baseline}
  .comments time{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .comments p{margin:1px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--body);font-size:15px;line-height:1.55}
  .comments .x{
    all:unset;cursor:pointer;font-family:var(--mono);font-size:10px;color:var(--muted);opacity:0;
  }
  .comments li:hover .x,.comments .x:focus-visible{opacity:1}
  .comments .x:hover{color:var(--danger)}
  .compose{display:flex;gap:8px;align-items:flex-end}
  .compose textarea{flex:1;resize:vertical;min-height:42px;font-family:var(--body);font-size:15px}

  .btn{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;cursor:pointer;
    border:1px solid var(--ink);background:transparent;color:var(--ink);
    padding:6px 11px;border-radius:2px;white-space:nowrap;
  }
  .btn:hover{background:var(--ink);color:var(--wafer)}
  .btn.ghost{border-color:var(--rule);color:var(--muted)}
  .btn.ghost:hover{background:transparent;color:var(--ink);border-color:var(--muted)}
  .btn.danger{border-color:var(--rule);color:var(--muted);margin-left:auto}
  .btn.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.big{font-size:13px;padding:10px 18px}

  input.add{
    width:100%;margin-top:8px;background:transparent;border:1px dashed var(--rule);
  }
  input.add::placeholder{color:var(--muted)}
  input.add:focus{outline:none;border-style:solid;border-color:var(--deep);background:var(--card)}
  .link{
    all:unset;cursor:pointer;display:inline-block;margin-top:8px;
    font-family:var(--mono);font-size:11px;color:var(--muted);
  }
  .link:hover{color:var(--deep)}
  .link:focus-visible{outline:2px solid var(--deep)}
  .empty{color:var(--muted);font-size:13.5px;padding:8px 0;margin:0}

  /* ---- week cards ---- */
  .week{background:var(--card);border:1px solid var(--rule);padding:12px 16px 12px;margin:0 0 14px}
  .week.now{box-shadow:inset 3px 0 0 var(--film-2)}
  .week.past{opacity:.86}
  .week > header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px}
  .week .wn{font-weight:500;color:var(--film-2)}
  .week .wr{color:var(--muted)}
  .week .badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--film-2);border:1px solid currentColor;padding:0 5px;border-radius:2px}
  .week .wp{margin-left:auto;color:var(--muted)}
  .week .bar{margin:6px 0 4px}
  .week .item:last-child{border-bottom:none}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:0;margin:0 0 26px;border-bottom:1px solid var(--rule)}
  .tabs button{
    all:unset;cursor:pointer;padding:8px 16px 9px;margin-bottom:-1px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted);
    border-bottom:2px solid transparent;
  }
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--film-2)}
  .tabs button:focus-visible{outline:2px solid var(--deep)}

  /* ---- calendar ---- */
  .cal{border:1px solid var(--rule);background:var(--card);margin:0 0 30px}
  .cal-row{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr))}
  .cal-row + .cal-row{border-top:1px solid var(--rule)}
  .cal-head{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center}
  .cal-head > div{padding:6px 0}
  .cal-head .we{color:var(--film-2)}
  .cal-wk{
    font-family:var(--mono);font-size:10px;color:var(--muted);padding:6px 0 0;text-align:center;
    display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--rule);
  }
  .cal-wk b{font-weight:500;color:var(--film-2)}
  .cal-day{
    all:unset;cursor:pointer;box-sizing:border-box;min-height:96px;padding:5px 6px 6px;
    display:flex;flex-direction:column;gap:2px;min-width:0;
    border-left:1px solid var(--rule);background:var(--wafer);
  }
  .cal-row > .cal-day:nth-child(2){border-left:none}
  .cal-day:hover{background:color-mix(in srgb,var(--wafer) 70%,var(--card))}
  .cal-day:focus-visible{outline:2px solid var(--deep);outline-offset:-2px}
  .cal-day.out{opacity:.45}
  .cal-day.sel{box-shadow:inset 0 0 0 2px var(--film-2)}
  .cal-day .top-line{display:flex;align-items:center;gap:4px}
  .cal-day .dn{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
  .cal-day.we .dn{color:var(--film-2)}
  .cal-day.today .dn{background:var(--ink);color:var(--wafer)}
  .cal-day .dc{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
  .cal-day .dc.all{color:var(--film-4)}
  .cal-day .lu{font-family:var(--mono);font-size:9.5px;color:var(--muted);opacity:.85;white-space:nowrap}
  .cal-day .dc + .lu{margin-left:5px}
  .cal-day .dn + .lu{margin-left:auto}
  .cal-day .dt{
    display:block;font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding-left:7px;position:relative;
  }
  .cal-day .dt::before{content:"";position:absolute;left:0;top:.5em;width:4px;height:4px;border-radius:50%;background:var(--film-2)}
  .cal-day .dt.done{color:var(--muted);text-decoration:line-through}
  .cal-day .dt.done::before{background:var(--film-4)}
  .cal-day .more{font-family:var(--mono);font-size:10px;color:var(--muted)}

  /* ---- holidays ---- */
  .holpick{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin:0 0 12px}
  .holpick .when{font-size:11px;color:var(--ink)}
  .holpick .link{margin:0}
  .holpick .seg{border:none;padding:0;gap:4px}
  .holpick .seg button{border:1px solid var(--rule)}
  .holpick .seg button[aria-pressed="true"]{border-color:var(--deep)}
  .cal-day .hn{display:block;font-size:10.5px;line-height:1.3;color:var(--danger);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-day.hol .dn{color:var(--danger)}
  .cal-day.hol.today .dn{background:var(--danger);color:#fff}
  .ds.hol .dn,.ds.hol .wd{color:var(--danger)}
  .ds.hol.sel .dn,.ds.hol.sel .wd{color:var(--wafer)}

  /* ---- gantt ---- */
  .gantt-wrap{overflow-x:auto;margin:0 0 12px;border:1px solid var(--rule);background:var(--card)}
  .gantt{--glw:250px;position:relative;min-width:640px}
  .g-row{display:grid;grid-template-columns:var(--glw) 1fr;min-height:32px}
  .g-row + .g-row{border-top:1px dotted var(--rule)}
  .g-label{
    position:sticky;left:0;z-index:2;background:var(--card);border-right:1px solid var(--rule);
    padding:6px 10px;font-size:13px;line-height:1.35;min-width:0;overflow-wrap:anywhere;
  }
  .g-row.ms-row .g-label{font-weight:500;display:flex;align-items:flex-start;gap:4px}
  .g-row.sub .g-label{padding-left:30px;font-size:12px;color:var(--muted)}
  .g-fold{
    all:unset;cursor:pointer;flex:none;width:16px;text-align:center;color:var(--muted);
    font-size:10px;line-height:18px;border-radius:2px;
  }
  .g-fold:hover{color:var(--ink)}
  .g-fold:focus-visible{outline:2px solid var(--deep)}
  .g-fold.none{visibility:hidden}
  .g-label .n{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400;margin-left:4px}
  .g-tools{display:flex;gap:14px;margin:0 0 8px}
  .g-row.group .g-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);padding-top:10px}
  .g-head .g-label{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .g-track{position:relative;min-width:0}
  .g-months{display:flex;height:100%}
  .g-months > div{
    font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:7px 0 6px 6px;
    border-left:1px solid var(--rule);white-space:nowrap;overflow:hidden;
  }
  .g-months > div.cur{color:var(--ink);font-weight:500}
  .g-grid{position:absolute;top:0;bottom:0;left:var(--glw);right:0;pointer-events:none;z-index:1}
  .g-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--rule);opacity:.6}
  .g-grid .today{width:2px;background:var(--film-3);opacity:1}
  .g-bar{
    all:unset;cursor:pointer;box-sizing:border-box;position:absolute;top:calc(50% - 8px);height:16px;z-index:1;
    border:1px solid var(--film-2);border-radius:2px;overflow:hidden;
    background:color-mix(in srgb,var(--film-2) 16%,transparent);
  }
  .g-bar > i{position:absolute;top:0;bottom:0;left:0;background:var(--film-2);opacity:.55}
  .g-bar.done{border-color:var(--film-4);background:color-mix(in srgb,var(--film-4) 30%,transparent)}
  .g-bar.late{border-color:var(--danger);border-style:dashed}
  .g-bar.clip-l{border-left-style:dotted;border-top-left-radius:0;border-bottom-left-radius:0}
  .g-bar.clip-r{border-right-style:dotted;border-top-right-radius:0;border-bottom-right-radius:0}
  .g-bar.dot{width:10px!important;height:10px;top:calc(50% - 5px);border-radius:50%;margin-left:-5px}
  .g-bar.small{top:calc(50% - 4px);height:8px;border-color:var(--muted);background:color-mix(in srgb,var(--muted) 20%,transparent)}
  .g-bar.small.done{border-color:var(--film-4);background:var(--film-4)}
  .g-bar:focus-visible{outline:2px solid var(--deep);outline-offset:1px}
  .g-legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:0 0 30px}
  .g-legend span{display:inline-flex;align-items:center;gap:6px}
  .g-legend i{display:inline-block;width:18px;height:9px;border:1px solid var(--film-2);border-radius:2px;background:color-mix(in srgb,var(--film-2) 16%,transparent)}
  .g-legend i.done{border-color:var(--film-4);background:color-mix(in srgb,var(--film-4) 30%,transparent)}
  .g-legend i.late{border-color:var(--danger);border-style:dashed;background:transparent}
  .g-legend i.today{width:2px;height:12px;border:none;background:var(--film-3)}

  /* ---- attachments ---- */
  .atts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .att-list{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:4px}
  .att-list li{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px}
  .att-list a{color:var(--deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .att-list a:hover{text-decoration:underline}
  .att-kind{
    flex:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--muted);
    border:1px solid var(--rule);border-radius:2px;padding:0 4px;min-width:30px;text-align:center;
  }
  .att-size{flex:none;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .att-list .x{all:unset;cursor:pointer;font-family:var(--mono);font-size:10px;color:var(--muted);opacity:0;margin-left:auto}
  .att-list li:hover .x,.att-list .x:focus-visible{opacity:1}
  .att-list .x:hover{color:var(--danger)}
  .att-busy{margin:0;width:100%;font-family:var(--mono);font-size:11px;color:var(--film-2)}
  .att-pick{cursor:pointer;display:inline-block}
  .att-hint{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .detail.drop{outline:2px dashed var(--film-2);outline-offset:4px;border-radius:2px}
  .comments p a{color:var(--deep);overflow-wrap:anywhere}

  /* ---- top line: month nav + search ---- */
  .topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
  .topline .month-nav{margin:0}
  .month-nav .m.solo{min-width:0;margin:0;text-align:left}
  .search{margin-left:auto;flex:1 1 150px;max-width:240px;min-width:0}
  .search input{
    width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:var(--card);
    border:1px solid var(--rule);border-radius:999px;padding:6px 14px;
  }
  .search input:focus{outline:none;border-color:var(--deep)}

  /* ---- day strip / jump ---- */
  .daystrip{margin:0 0 12px}
  .ds-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 6px;padding:0 38px}
  .ds-label{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted)}
  .ds-head .link{margin:0}
  .ds-row{display:flex;align-items:center;gap:6px}
  .ds-arrow{
    all:unset;cursor:pointer;flex:none;width:30px;height:30px;border-radius:50%;
    display:grid;place-items:center;font-size:17px;line-height:1;color:var(--muted);
    border:1px solid var(--rule);background:var(--card);transition:color .15s,border-color .15s;
  }
  .ds-arrow:hover{color:var(--ink);border-color:var(--muted)}
  .ds-arrow:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
  .ds-track{
    flex:1;min-width:0;display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px) / 7);gap:6px;
    overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;padding:2px 0;
  }
  .ds-track::-webkit-scrollbar{display:none}
  .ds-track:focus-visible{outline:2px solid var(--deep);outline-offset:3px;border-radius:14px}
  .ds{
    all:unset;cursor:pointer;box-sizing:border-box;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:7px 0 6px;border-radius:14px;transition:background .18s,color .18s,box-shadow .18s;
  }
  .ds.mon{scroll-snap-align:start}
  .ds:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
  .ds:focus-visible{outline:2px solid var(--deep);outline-offset:-2px}
  .ds .wd{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .ds .dn{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.25}
  .ds.past .dn{color:var(--muted)}
  .ds.we .wd{color:var(--film-2)}
  .ds.first .wd{color:var(--deep);font-weight:500}
  .ds.today{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--deep) 55%,transparent)}
  .ds.today .dn{color:var(--deep)}
  .ds.sel{background:var(--deep);box-shadow:none}
  .ds.sel .wd,.ds.sel .dn{color:var(--wafer)}
  .ds .dots{display:flex;gap:3px;height:5px;margin-top:2px}
  .ds .dots i{width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,var(--muted) 50%,transparent)}
  .ds .dots i.on{background:var(--film-4)}
  .ds.sel .dots i{background:color-mix(in srgb,var(--wafer) 50%,transparent)}
  .ds.sel .dots i.on{background:var(--wafer)}
  @media (prefers-reduced-motion:reduce){.ds-track{scroll-behavior:auto}}
  input.jump{
    font:inherit;font-family:var(--mono);font-size:12px;color:var(--muted);background:transparent;
    border:1px solid var(--rule);border-radius:2px;padding:4px 6px;height:32px;box-sizing:border-box;
  }
  input.jump:hover,input.jump:focus{color:var(--ink);border-color:var(--muted);outline:none}

  /* ---- CV import ---- */
  .cvpanel{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px 14px;margin:0 0 14px}
  .cvlist{list-style:none;margin:10px 0;padding:0}
  .cvlist li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dotted var(--rule)}
  .cvlist .rt{display:flex;flex-direction:column;gap:1px;font-size:13.5px}
  .cvlist .rt small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .cvlist .when,.cvlist .btn{flex:none}
  .cvpanel .err{color:var(--danger);font-size:13px;margin:6px 0 0}

  /* ---- deadlines ---- */
  .deadlines{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 18px;font-size:12.5px}
  .dl-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
  .dl{
    all:unset;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;max-width:260px;
    border:1px solid var(--rule);border-radius:999px;padding:3px 10px;background:var(--card);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .dl b{font-family:var(--mono);font-size:11px;color:var(--deep);font-weight:500}
  .dl.soon b{color:var(--film-2)}
  .dl.late{border-color:color-mix(in srgb,var(--danger) 50%,var(--rule))}
  .dl.late b{color:var(--danger)}
  .dl:hover{border-color:var(--muted)}
  .dl:focus-visible{outline:2px solid var(--deep)}
  .dl-none{color:var(--muted);font-size:12px}
  .dl-ics{margin:0 0 0 auto}
  .due{flex:none;font-family:var(--mono);font-size:10.5px;color:var(--deep);border:1px solid color-mix(in srgb,var(--deep) 35%,transparent);border-radius:2px;padding:0 5px}
  .due.soon{color:var(--film-2);border-color:color-mix(in srgb,var(--film-2) 45%,transparent)}
  .due.late{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
  .tabs{overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap}

  /* ---- search results / tags ---- */
  .results{list-style:none;margin:0 0 10px;padding:0}
  .results li + li{border-top:1px dotted var(--rule)}
  .results button{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:10px;width:100%;padding:8px 2px;box-sizing:border-box}
  .results button:hover .rt{color:var(--deep)}
  .results button:focus-visible{outline:2px solid var(--deep)}
  .kind{flex:none;font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--rule);border-radius:2px;padding:0 5px;min-width:44px;text-align:center}
  .rt{flex:1;min-width:0;overflow-wrap:anywhere}
  .rt.done{color:var(--muted);text-decoration:line-through}
  .tags{margin-top:26px;display:flex;flex-wrap:wrap;gap:6px}
  .tags h2{width:100%}
  .tag{all:unset;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:2px 9px;background:var(--card)}
  .tag span{color:var(--muted);margin-left:5px}
  .tag.on{border-color:var(--deep);color:var(--deep)}
  .tag:focus-visible{outline:2px solid var(--deep)}
  .hint{margin:4px 0 0;font-size:11.5px;color:var(--muted)}

  /* ---- checklist / linked ---- */
  .checks ul{list-style:none;margin:0 0 4px;padding:0;display:grid;gap:3px}
  .checks li{display:flex;align-items:center;gap:8px;font-size:13.5px}
  .checks li input{margin:0;accent-color:var(--film-4)}
  .checks li.done span{color:var(--muted);text-decoration:line-through}
  .checks .x{all:unset;cursor:pointer;font-family:var(--mono);font-size:10px;color:var(--muted);opacity:0;margin-left:auto}
  .checks li:hover .x,.checks .x:focus-visible{opacity:1}
  .checks .x:hover{color:var(--danger)}
  input.add.small{margin-top:2px;padding:4px 9px;font-size:13px}
  .linked{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .linked .lk{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .linked .chip{cursor:pointer;background:transparent;max-width:none}
  .fields .wide{flex:1 1 260px}
  .fields .wide .edit,.fields .wide textarea{width:100%}
  .fields.col{flex-direction:column;align-items:stretch}
  .fields.col label{align-items:flex-start;flex-direction:column;gap:3px}
  .fields textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:6px 9px;resize:vertical;width:100%}
  input.edit.sm{flex:0 1 160px;width:160px}

  /* ---- papers ---- */
  .pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:0 0 10px}
  .pipe-s{
    all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;min-width:0;
    padding:9px 12px 8px;background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--sc,var(--rule));border-radius:3px;
  }
  .pipe-s b{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.1}
  .pipe-s span{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pipe-s:hover{border-color:var(--muted);border-top-color:var(--sc,var(--muted))}
  .pipe-s:focus-visible{outline:2px solid var(--deep)}
  .pipe-s.zero{cursor:default;opacity:.5}
  .st-draft{--sc:var(--muted)} .st-submitted{--sc:var(--film-3)} .st-review{--sc:var(--film-2)}
  .st-revision{--sc:var(--film-1)} .st-accepted{--sc:var(--film-4)} .st-published{--sc:var(--film-4)}
  .psum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:0 0 18px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .psum .btn{margin-left:auto}
  .pgroup{margin:0 0 16px}
  .pg-head{
    all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;margin:0 0 8px;
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);
  }
  .pg-head::after{content:"";flex:1;height:1px;background:var(--rule)}
  .pg-head .n{color:var(--deep)}
  .pg-head .chev{width:10px}
  .pg-head:focus-visible{outline:2px solid var(--deep)}
  .plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .prow{
    display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start;
    padding:11px 12px 10px 14px;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--sc,var(--rule));border-radius:3px;
  }
  .prow.open{border-color:var(--muted);border-left-color:var(--sc,var(--rule))}
  .pr-main{min-width:0}
  .pr-title{
    all:unset;cursor:pointer;font-size:14.5px;font-weight:500;line-height:1.45;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .prow.open .pr-title{-webkit-line-clamp:unset;display:block}
  .pr-title:hover{color:var(--deep)}
  .pr-title:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
  .pm{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .pm .pj{color:var(--ink)}
  .pr-step{display:flex;align-items:center;gap:2px;border:1px solid var(--rule);border-radius:999px;padding:2px}
  .pr-step button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-size:14px;color:var(--muted)}
  .pr-step button:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
  .pr-step button:disabled{opacity:.25;cursor:default}
  .pr-step button:focus-visible{outline:2px solid var(--deep)}
  .pr-stage{font-family:var(--mono);font-size:11px;min-width:58px;text-align:center;color:var(--sc,var(--ink))}
  .pr-detail{grid-column:1/-1;border-top:1px dotted var(--rule);margin-top:6px}
  .pr-detail .detail{padding:12px 0 2px}
  .pd-head{display:flex;align-items:baseline;gap:10px}
  .pd-head b{font-size:15px}
  .pd-head .link{margin:0 0 0 auto}

  /* 원고·실험 상세: 라벨 위, 입력칸 아래의 격자 양식 */
  .detail.form .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;align-items:end}
  .detail.form .fields > input.edit{grid-column:1/-1;width:100%}
  .detail.form .fields label{flex-direction:column;align-items:stretch;gap:4px;min-width:0;white-space:nowrap}
  .detail.form .fields label > input,.detail.form .fields label > select,.detail.form .fields label > textarea{flex:none;width:100%;min-width:0;max-width:100%;box-sizing:border-box}
  .detail.form .fields .wide{grid-column:1/-1}
  .detail.form .fields .btn.danger{justify-self:start;margin:0;align-self:end}
  .detail.form .fields > .link{grid-column:1/-1;justify-self:start;margin:0}
  .fields label{white-space:nowrap}
  .fields select{min-width:0;max-width:100%}
  @media (max-width:640px){
    .pipe{grid-template-columns:repeat(3,minmax(0,1fr))}
    .prow{grid-template-columns:1fr}
    .pr-step{justify-self:start}
    .psum .btn{margin-left:0}
  }

  /* ---- library ---- */
  .lib-add{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px 14px;margin:0 0 14px}
  .la-row{display:flex;gap:8px}
  .la-row .edit{flex:1;min-width:0;font-size:14px}
  .lib-add .hint{margin:6px 0 0}
  .lib-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}
  .seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:999px;padding:2px;gap:2px}
  .seg button{all:unset;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--muted);padding:4px 10px;border-radius:999px;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--deep);color:var(--wafer)}
  .seg button:focus-visible{outline:2px solid var(--deep)}
  .lib-bar .lib-q{flex:1 1 200px;min-width:0}
  .lib-bar select{flex:none}
  .lib-export{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 12px;padding:8px 0;border-top:1px dotted var(--rule);border-bottom:1px dotted var(--rule)}
  .lib-export .btn:first-of-type{margin-left:auto}
  .lib-export .btn:disabled{opacity:.4;cursor:default}
  .chk{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted);cursor:pointer}
  .chk input{margin:0;accent-color:var(--deep)}
  .reflist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .rrow{
    display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;
    padding:10px 12px;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--rc,var(--rule));border-radius:3px;
  }
  .rs-toread{--rc:var(--muted)} .rs-reading{--rc:var(--film-2)} .rs-done{--rc:var(--film-4)}
  .rrow.open{border-color:var(--muted);border-left-color:var(--rc)}
  .rrow .rsel{margin:4px 0 0;accent-color:var(--deep)}
  .star{all:unset;cursor:pointer;font-size:15px;line-height:1.3;color:var(--muted)}
  .star.on{color:var(--film-3)}
  .star:focus-visible{outline:2px solid var(--deep)}
  .rr-main{min-width:0}
  .rrow .pm a{color:var(--deep)}
  .rrow .pm .chip{font-size:10px}
  .rr-side{display:flex;align-items:center;gap:6px}
  .rr-del{all:unset;cursor:pointer;font-family:var(--mono);font-size:10.5px;color:var(--muted);opacity:.55;padding:3px 4px}
  .rrow:hover .rr-del,.rr-del:focus-visible{opacity:1}
  .rr-del:hover{color:var(--danger)}
  .rr-del:focus-visible{outline:2px solid var(--deep)}
  .lib-export .btn.danger{margin-left:0}
  .rr-status{font:inherit;font-family:var(--mono);font-size:11px;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:3px 8px}
  .rrow .pr-detail{grid-column:1/-1}
  .abs summary{cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .abs p{margin:6px 0 0;font-family:var(--body);font-size:14px;line-height:1.6;white-space:normal}
  .detail.form .fields .abs{grid-column:1/-1}
  input.att-link{flex:1 1 220px;margin:0}
  @media (max-width:640px){
    .rrow{grid-template-columns:auto auto minmax(0,1fr)}
    .rr-side{grid-column:3;justify-self:start}
    .lib-export .btn:first-of-type{margin-left:0}
  }

  /* ---- lab ---- */
  .lab-form{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px 14px}
  .lab-form > *{min-width:0}
  .lab-form h2{margin-bottom:2px}
  .lf-row{display:flex;flex-wrap:wrap;gap:8px}
  .lf-row > *{min-width:0;max-width:100%}
  .lf-row .edit{flex:1 1 160px}
  .lf-row select{flex:1 1 220px;text-overflow:ellipsis}
  .lf-row input[type=date]{flex:0 1 auto}
  .lab-form textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--wafer);border:1px solid var(--rule);border-radius:2px;padding:6px 9px;resize:vertical;width:100%;max-width:100%}
  .lab-form textarea:focus,.lab-form .edit:focus{outline:none;border-color:var(--deep)}
  .lf-actions{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .lf-actions .hint{margin:0}
  input.lab-q{width:100%;margin:0 0 6px}
  .sline{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:10px;width:100%;padding:8px 0;box-sizing:border-box;min-width:0}
  .sline b{font-weight:500;flex:none}
  .sline .sp,.sline .sr{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px}
  .sline .sp{flex:1 1 40%}
  .sline .sr{flex:1 1 30%;color:var(--ink)}
  .sline:focus-visible{outline:2px solid var(--deep)}

  /* ---- review ---- */
  .wk-nav{display:flex;align-items:center;gap:10px;margin:0 0 20px}
  .wk-nav .m{font-family:var(--display);font-weight:700;font-size:22px;display:flex;align-items:baseline;gap:10px}
  .wk-nav .m small{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
  .rsum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
  .rs h3{margin:0 0 4px;font-family:var(--mono);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em}
  .rs ul{margin:0;padding:0 0 0 2px;list-style:none;display:grid;gap:3px;font-size:13.5px}
  .rs .kind{margin-right:6px}
  .rv{display:grid;gap:4px;margin:0 0 10px}
  .rv span{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .rv textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;resize:vertical;width:100%}
  .rv textarea:focus{outline:none;border-color:var(--deep)}
  .rp-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}
  .rp-actions .hint{margin:0}
  .report{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px 14px;max-height:360px;overflow:auto;color:var(--ink)}
  .heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
  .hc{display:grid;grid-template-rows:repeat(7,11px);gap:3px}
  .heat i,.heat-legend i{display:block;width:11px;height:11px;border-radius:2px;background:color-mix(in srgb,var(--rule) 70%,transparent)}
  .heat i.l1,.heat-legend i.l1{background:color-mix(in srgb,var(--film-4) 30%,transparent)}
  .heat i.l2,.heat-legend i.l2{background:color-mix(in srgb,var(--film-4) 55%,transparent)}
  .heat i.l3,.heat-legend i.l3{background:color-mix(in srgb,var(--film-4) 80%,transparent)}
  .heat i.l4,.heat-legend i.l4{background:var(--film-4)}
  .heat i.f{opacity:.25}

    display:flex;flex-direction:column;gap:6px;min-width:0;min-height:96px;padding:8px;

  .bh{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;padding:0 2px}

  .ipanel .detail{padding:10px 0 0}
  .lchip{display:inline-flex;align-items:center;gap:6px;max-width:100%}

  @media (max-width:480px){ .board{grid-template-columns:1fr} .capture .dlg-actions .hint{display:none} }

  /* ---- 미팅 ---- */
  .meets .sline .sp{flex:1 1 auto}

  .checks .lk{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:0 0 5px}

  /* ---- 리비전 대응표 ---- */
  .revtab{border:1px solid var(--rule);border-left:3px solid var(--film-2);border-radius:3px;padding:10px 12px;display:grid;gap:10px;background:color-mix(in srgb,var(--film-2) 4%,transparent)}
  .rv-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
  .rv-head > b{font-family:var(--display);font-size:15px}

  .rv-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}

  .rv-q .lk{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

  /* ---- 오늘 요약 ---- */
  .brief{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--film-2);border-radius:3px;padding:10px 14px;margin:0 0 18px}
  .br-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:13.5px}

  .brief li{display:flex;align-items:baseline;gap:10px;font-size:13.5px;min-width:0}

  /* ---- import dialog ---- */
  .dlg{
    border:1px solid var(--rule);background:var(--wafer);color:var(--ink);border-radius:2px;
    padding:20px;width:calc(100% - 32px);max-width:560px;

  .dlg textarea{
    display:block;width:100%;min-height:150px;resize:vertical;font-family:var(--mono);font-size:12px;

  /* ---- 절기 풍경 (season.js) ---- */
  .season{max-width:1140px;margin:16px auto 0;padding:0 28px}
  .season[hidden]{display:none}
  .season .frame{position:relative;height:128px;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--card)}
  .season canvas{display:block;width:100%;height:100%}
  .season-label{
    position:absolute;left:12px;top:10px;z-index:1;font-family:var(--mono);font-size:11px;letter-spacing:.02em;
    color:var(--ink);background:color-mix(in srgb,var(--wafer) 78%,transparent);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    padding:3px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--rule) 70%,transparent);
  }
  .season-label:empty{display:none}
  .season-place{
    all:unset;cursor:pointer;position:absolute;right:12px;top:10px;z-index:1;
    font-family:var(--mono);font-size:11px;color:var(--ink);
    background:color-mix(in srgb,var(--wafer) 78%,transparent);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    padding:3px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--rule) 70%,transparent);
    max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .season-place:hover{border-color:var(--muted)}
  .season-place:focus-visible{outline:2px solid var(--deep)}
  .season-place::before{content:"⌖ ";color:var(--muted)}
  .season{position:relative}
  .season .frame{overflow:visible}
  .season canvas{border-radius:3px}
  .season-pop{
    position:absolute;right:10px;top:40px;z-index:25;width:min(360px,calc(100% - 20px));
    background:var(--wafer);color:var(--ink);border:1px solid var(--rule);border-radius:4px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;display:grid;gap:8px;font-size:13px;
  }
  .season-pop[hidden]{display:none}
  .sp-head{display:flex;align-items:center;justify-content:space-between}
  .sp-head b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .sp-x{all:unset;cursor:pointer;font-size:18px;line-height:1;color:var(--muted);padding:0 4px}
  .sp-row{display:flex;gap:6px}
  .sp-row input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:6px 8px}
  .sp-row input:focus{outline:none;border-color:var(--deep)}
  .sp-row button,.sp-geo{font:inherit;font-family:var(--mono);font-size:11.5px;cursor:pointer;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:5px 10px}
  .sp-row button:hover,.sp-geo:hover{border-color:var(--muted)}
  .sp-geo{justify-self:start}
  .sp-list{display:grid;gap:2px;max-height:200px;overflow:auto;color:var(--muted);font-size:12.5px}
  .sp-list:empty{display:none}
  .sp-list button{all:unset;cursor:pointer;padding:5px 6px;border-radius:2px;color:var(--muted);font-size:12.5px}
  .sp-list button b{color:var(--ink);font-weight:500}
  .sp-list button:hover,.sp-list button:focus-visible{background:var(--card)}
  .sp-note{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5}
  .season-label b{font-family:var(--display);font-weight:700;margin-right:5px}
  .season-toggle svg{display:block}
  /* 풍경 크게 보기: 누르면 띠 → 크게 → 전체 화면(라이브 배경화면) */
  .season canvas{cursor:zoom-in}
  .season.tall .frame{height:clamp(260px,62vh,560px)}
  .season.full .frame{position:fixed;inset:0;z-index:1000;height:auto;border:0;border-radius:0;background:#0e1430}
  .season.full canvas{border-radius:0;cursor:default}
  html.scene-full{overflow:hidden}
  .season.full .season-label{top:calc(14px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left))}
  .season.full .season-place{top:calc(14px + env(safe-area-inset-top));bottom:auto;right:calc(16px + env(safe-area-inset-right));max-width:50%}
  .season-label,.season-place,.season-ctl{transition:opacity .6s}
  .season.full.idle{cursor:none}
  .season.full.idle canvas{cursor:none}
  .season.full.idle .season-label,.season.full.idle .season-place,.season.full.idle .season-ctl{opacity:0;pointer-events:none}
  .season-ctl{position:absolute;right:10px;bottom:10px;z-index:2;display:flex;align-items:center;gap:6px}
  .season.full .season-ctl{right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom))}
  .sc-btn{
    all:unset;cursor:pointer;display:grid;place-items:center;width:28px;height:28px;border-radius:999px;color:var(--ink);
    background:color-mix(in srgb,var(--wafer) 78%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    border:1px solid color-mix(in srgb,var(--rule) 70%,transparent);
  }
  .sc-btn:hover{border-color:var(--muted)}
  .sc-btn:focus-visible{outline:2px solid var(--deep)}
  .sc-btn svg{width:15px;height:15px}
  .sc-sound .on{display:none}
  .sc-sound[aria-pressed="true"] .on{display:inline}
  .sc-sound[aria-pressed="true"] .off{display:none}
  .sc-sound[aria-pressed="true"]{color:var(--film-2)}
  .sc-vol{width:76px;accent-color:var(--film-2);display:none}

  .season:not(.tall):not(.full) .sc-full,.season:not(.tall):not(.full) .sc-close,.season.full .sc-full{display:none}
  .season:not(.tall):not(.full):not(.sound) .season-ctl{display:none}
  .season:not(.tall):not(.full) .season-ctl{bottom:8px;right:8px}

  .season-clock{display:none}

    display:block;position:absolute;z-index:1;pointer-events:none;color:#fff;

  .ck-time{font-family:var(--display);font-weight:700;font-size:clamp(52px,10vw,120px);line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}

  .season-toggle[aria-pressed="true"]{color:var(--film-2);border-color:color-mix(in srgb,var(--film-2) 55%,transparent)}

  @media (max-width:640px){

    .ds-track{gap:3px;grid-auto-columns:calc((100% - 18px) / 7)}
    input.jump{width:36px;padding:4px 2px;color:transparent}
    .season-place{top:auto;bottom:8px;max-width:calc(100% - 24px)}
    .season-label{max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .season-pop{top:calc(100% + 6px)}
    .season:not(.tall):not(.full) .season-ctl,.season.tall .season-ctl{top:8px;bottom:auto;right:8px}
    .season.tall .frame{height:clamp(240px,58vh,520px)}
  }
  @media (max-width:420px){
    .stats{grid-template-columns:1fr}
    .top .home{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  /* 휴대폰: 글자가 16px보다 작은 칸을 누르면 iPhone이 화면을 확대해서 레이아웃이 밀림 → 입력칸 글자를 16px로 */
  @media (pointer:coarse){
    input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}
    input[type=date]{min-width:0;max-width:100%}
  }
</style>
</head>
<body>
<div class="film-top"></div>

<div class="top">
  <a class="home" href="../">← homepage</a>
  <div class="who" id="who"></div>
  <button class="theme-toggle cap" id="capture" type="button" aria-label="빠른 메모 (Ctrl+K)" title="빠른 메모 (Ctrl+K)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/>
    </svg>
  </button>
  <button class="theme-toggle gear" id="gear" type="button" aria-label="설정" title="설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"

      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
    </svg>
  </button>
</div>

<div class="season" id="season" hidden>
  <div class="frame">
    <canvas aria-hidden="true"></canvas>
    <div class="season-label"></div>
    <button class="season-place" type="button" aria-haspopup="dialog"></button>
    <div class="season-clock" aria-hidden="true"><div class="ck-time"></div><div class="ck-date"></div><div class="ck-wx"></div></div>
    <div class="season-ctl">
      <button class="sc-btn sc-sound" type="button" aria-pressed="false" aria-label="배경 소리" title="배경 소리 (날씨·시각·계절 따라)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
      <input class="sc-vol" type="range" min="0" max="1" step="0.05" aria-label="소리 크기">
      <button class="sc-btn sc-full" type="button" aria-label="전체 화면" title="전체 화면 (배경화면처럼)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="sc-btn sc-close" type="button" aria-label="작게 보기" title="작게 보기 (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
